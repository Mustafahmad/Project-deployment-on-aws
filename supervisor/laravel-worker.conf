; Supervisor config for Laravel queue worker
; Copy to: /etc/supervisor/conf.d/laravel-worker.conf
; Then: sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start laravel-worker:*

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/your_project/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/your_project/storage/logs/worker.log
stopwaitsecs=3600
